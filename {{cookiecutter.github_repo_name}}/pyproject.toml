{%- set all_python = _cookiecutter.python_requires | sort -%}
{%- set py_versions = all_python | select("ge", cookiecutter.python_requires) | list -%}
[project]
name = "{{cookiecutter.github_repo_name}}"
dynamic = ["version"]
description = "{{cookiecutter.project_description}}"
authors = [
    {name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}"},
]
readme = "README.md"
requires-python = ">={{cookiecutter.python_requires}}"
{%- if cookiecutter.license != "Proprietary" %}
license = "{{cookiecutter.license}}"
{%- endif %}
license-files = ["LICENSE"]
classifiers = [
{%- for v in py_versions %}
    "Programming Language :: Python :: {{ v }}",
{%- endfor %}
    "Programming Language :: Python :: 3 :: Only",
{%- if cookiecutter.license == "Proprietary" %}
    "Private :: Do Not Upload",
{%- endif %}
{%- if cookiecutter.enable_mypy == "yes" %}
    "Typing :: Typed",
{%- endif %}
]
dependencies = []

[project.urls]
Homepage = "https://github.com/{{cookiecutter.github_username}}/{{cookiecutter.github_repo_name}}"
{%- if cookiecutter.enable_docs == "yes" %}
Documentation = "https://{{cookiecutter.github_username}}.github.io/{{cookiecutter.github_repo_name}}"
{%- endif %}
Repository = "https://github.com/{{cookiecutter.github_username}}/{{cookiecutter.github_repo_name}}"
Issues = "https://github.com/{{cookiecutter.github_username}}/{{cookiecutter.github_repo_name}}/issues"
Changelog = "https://github.com/{{cookiecutter.github_username}}/{{cookiecutter.github_repo_name}}/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/{{cookiecutter.project_slug}}"]

[dependency-groups]
{%- if cookiecutter.enable_docs == "yes" %}
docs = [
    "mike>=2.2,<3",
    "mkdocs-autorefs>=1.4.4,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocstrings[python]>=1.0.8,<2",
]
{%- endif %}
dev = [
{%- if cookiecutter.enable_docs == "yes" %}
    {include-group = "docs"},
{%- endif %}
{%- if cookiecutter.enable_interrogate == "yes" %}
    "interrogate>=1.7,<2",
{%- endif %}
{%- if cookiecutter.enable_mypy == "yes" %}
    "mypy>=2.4,<3",
{%- endif %}
    "pre-commit>=4.7,<5",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17.1,<0.18",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--import-mode=importlib"]
strict = true

[tool.coverage.run]
source_pkgs = ["{{cookiecutter.project_slug}}"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-native rules
    "D",   # pydocstyle
]
# E501: line length is handled by `ruff format`; long strings/URLs are fine.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["{{cookiecutter.project_slug}}"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.format]
docstring-code-format = true
{%- if cookiecutter.enable_interrogate == "yes" %}

[tool.interrogate]
style = "google"
fail-under = 80
ignore-private = true
ignore-semiprivate = true
color = true
{%- endif %}
{%- if cookiecutter.enable_mypy == "yes" %}

[tool.mypy]
python_version = "{{cookiecutter.python_requires}}"
files = ["src", "tests"]
pretty = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
{%- endif %}
